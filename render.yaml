# Render Blueprint for XPALLA — deploy as a Node web service.
# In Render: New → Blueprint → connect this repo → it reads this file.
services:
  - type: web
    name: xpalla
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      # Demo runs on the built-in file database — no config required.
      # To enable real AI later, add ANTHROPIC_API_KEY in the Render dashboard.
      # To persist data across restarts, add SUPABASE_URL + SUPABASE_SERVICE_KEY.
      - key: NODE_VERSION
        value: "20"
  - type: web
    name: leadgen
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node leadgen/server.js
    autoDeploy: true
    envVars:
      # Runs in demo mode with no config. In the Render dashboard add:
      #   LEADGEN_PASSWORD           (recommended — pre-seeds the login password)
      #   SUPABASE_URL + SUPABASE_SERVICE_KEY  (persist data; free-tier disk is ephemeral)
      #   ANTHROPIC_API_KEY          (real AI scoring + outreach drafting)
      #   RESEND_API_KEY             (email alerts for new captured leads)
      - key: NODE_VERSION
        value: "20"
